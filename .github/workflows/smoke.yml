# Smoke — packaged fx
# Demo programs exit 42 on success; assert that explicitly (GHA treats nonzero as fail).
# Linux: IR → native (ships third_party/qbe/obj/qbe).
# Windows: emit-C path in CI (IR on Windows still needs WSL + the shipped Linux QBE).
# macOS: skip-clean until a Darwin binary ships.

name: smoke

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: doctor
        run: bin\fx.exe doctor
      - name: showcase_core
        # Demo success is exit 42; `if errorlevel N` means >= N.
        # Use --emit-c: GitHub windows-latest has no WSL IR toolchain by default.
        run: |
          bin\fx.exe run examples\showcase_core\main.fx --emit-c
          if errorlevel 43 exit /b 1
          if errorlevel 42 exit /b 0
          echo expected exit 42
          exit /b 1
      - name: tool_bytes
        run: |
          bin\fx.exe run examples\tool_bytes\main.fx --emit-c
          if errorlevel 43 exit /b 1
          if errorlevel 42 exit /b 0
          echo expected exit 42
          exit /b 1

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: doctor
        run: |
          chmod +x bin/fx third_party/qbe/obj/qbe
          ./bin/fx doctor
      - name: showcase_core
        run: |
          set +e
          ./bin/fx run examples/showcase_core/main.fx
          code=$?
          set -e
          if [ "$code" -ne 42 ]; then
            echo "expected exit 42, got $code"
            exit 1
          fi
      - name: tool_bytes
        run: |
          set +e
          ./bin/fx run examples/tool_bytes/main.fx
          code=$?
          set -e
          if [ "$code" -ne 42 ]; then
            echo "expected exit 42, got $code"
            exit 1
          fi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: skip until Darwin binary
        run: |
          if [ -x bin/fx ] && file bin/fx | grep -qi 'Mach-O'; then
            set +e
            ./bin/fx doctor || exit $?
            ./bin/fx run examples/showcase_core/main.fx
            code=$?
            set -e
            if [ "$code" -ne 42 ]; then
              echo "expected exit 42, got $code"
              exit 1
            fi
          else
            echo "macOS binary not in this package yet — skip-clean."
            exit 0
          fi
